<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Submitted - GreenThumb Gardening</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <!-- Same header as index.html -->
  </header>

  <main>
    <h1>Thank You!</h1>
    <p>Your form has been submitted successfully.</p>
    <div id="formDataDisplay"></div>
  </main>

  <footer>
    <!-- Same footer as index.html -->

  <script>
    // Display submitted form data
    const params = new URLSearchParams(window.location.search);
    document.getElementById('formDataDisplay').innerHTML = `
      <p><strong>Title:</strong> ${params.get('postTitle')}</p>
      <p><strong>Content:</strong> ${params.get('postContent')}</p>
    `;
  </script>
</body>
</html>
